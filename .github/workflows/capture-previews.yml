name: Capture homepage previews

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/capture-previews.yml"
      - "scripts/capture-previews.mjs"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Screenshot listing homepages
        run: node scripts/capture-previews.mjs
      - name: Commit preview images
        run: |
          git config user.name letscallsal
          git config user.email letscallsal@gmail.com
          git add public/previews src/content/directories
          if git diff --cached --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m "Add real homepage previews for Directory cards."
          git push
