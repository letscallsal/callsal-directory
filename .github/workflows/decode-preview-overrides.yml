name: Decode homepage preview overrides

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-preview-overrides.yml"
      - "scripts/decode-preview-overrides.mjs"
      - "scripts/preview-overrides/**"

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Decode override JPEGs
        run: node scripts/decode-preview-overrides.mjs
      - name: Commit preview images
        run: |
          git config user.name letscallsal
          git config user.email letscallsal@gmail.com
          git add public/previews src/content/directories
          if git diff --cached --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m "Replace bot-wall previews with real homepage shots."
          git push
